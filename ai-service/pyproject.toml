[tool.ruff]
# Exclude commonly ignored directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Enable standard lint rules
select = ["E", "F", "W", "I"]
ignore = []

# Allow ruff to fix violations automatically
fixable = ["ALL"]
unfixable = []

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for services and APIs",
    "regression: Regression tests against expected score ranges",
    "performance: Performance and benchmark tests",
    "slow: Tests requiring real embedding model or heavy computation",
    "property: Property-based invariant tests using Hypothesis",
    "api: FastAPI route and contract tests",
]
