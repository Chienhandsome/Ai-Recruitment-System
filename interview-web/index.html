<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Interview</title><link rel="stylesheet" href="style.css"></head><body>
<main id="gate"><p class="brand">SMARTRECRUIT · AI INTERVIEW</p><h1 id="title">Đang kiểm tra link…</h1><p id="description">Vui lòng chờ.</p><label>Email ứng viên<input id="email" type="email" autocomplete="email"></label><button id="sendOtp">Gửi mã OTP</button><div id="otpBlock" hidden><label>Mã OTP (6 hoặc 8 số)<input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="8"></label><button id="verifyOtp">Xác thực và bắt đầu</button></div><p id="error" role="alert"></p></main>
<main id="room" hidden><header><span class="brand">AI INTERVIEW</span><span id="timer" aria-label="Thời gian còn lại">--</span></header><section class="question"><p>AI INTERVIEWER</p><h1 id="question">Đang chuẩn bị…</h1><p id="status" aria-live="polite">Đang khởi tạo camera và microphone…</p></section><section class="answer"><video id="preview" autoplay muted playsinline></video><textarea id="transcript" readonly placeholder="Nội dung nhận diện giọng nói sẽ xuất hiện tại đây…"></textarea><div class="actions"><button id="answerNow" hidden>Trả lời ngay</button><button id="endAnswer" disabled>Kết thúc câu trả lời</button></div></section></main>
<main id="ended" hidden aria-live="polite"><p class="brand">AI INTERVIEW</p><h1>Phiên phỏng vấn đã kết thúc</h1><p id="endMessage"></p></main><script src="config.js"></script><script src="app.js"></script></body></html>
