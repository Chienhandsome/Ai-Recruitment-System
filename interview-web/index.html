<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Interview</title><link rel="stylesheet" href="style.css"></head><body>
<main id="gate"><p class="brand">SMARTRECRUIT · AI INTERVIEW</p><h1 id="title">Đang kiểm tra link…</h1><p id="description">Vui lòng chờ.</p><label>Email ứng viên<input id="email" type="email" autocomplete="email"></label><button id="sendOtp">Gửi mã OTP</button><div id="otpBlock" hidden><label>Mã OTP gồm 6 số<input id="otp" inputmode="numeric" maxlength="6"></label><button id="verifyOtp">Xác thực và bắt đầu</button></div><p id="error" role="alert"></p></main>
<main id="room" hidden><header><span class="brand">AI INTERVIEW</span><span id="timer">--</span></header><section class="question"><p>AI INTERVIEWER</p><h1 id="question">Đang chuẩn bị…</h1><p id="status">Đang khởi tạo camera và microphone…</p></section><section class="answer"><video id="preview" autoplay muted playsinline></video><textarea id="transcript" readonly placeholder="Transcript Speech-to-Text sẽ xuất hiện tại đây…"></textarea><button id="answerNow" hidden>Trả lời ngay</button><button id="endAnswer" disabled>Kết thúc câu trả lời</button></section></main>
<main id="ended" hidden><p class="brand">AI INTERVIEW</p><h1>Phiên phỏng vấn đã kết thúc</h1><p id="endMessage"></p></main><script src="config.js"></script><script src="app.js"></script></body></html>
